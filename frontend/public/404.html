<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#fff8f4" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Aaira's Kitchen</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, #ffe2e8, transparent 50%), #fff8f4;
        color: #4b312d;
        font-family: Arial, sans-serif;
      }
      main {
        max-width: 600px;
      }
      span {
        font: 600 clamp(100px, 24vw, 190px) Georgia;
        color: #efc9d3;
        line-height: 1;
      }
      h1 {
        font: 600 clamp(34px, 7vw, 52px) Georgia;
        margin: 0 0 12px;
      }
      p {
        color: #876f6a;
        line-height: 1.7;
      }
      a {
        display: inline-block;
        margin-top: 18px;
        padding: 16px 24px;
        border-radius: 17px;
        background: linear-gradient(135deg, #ec7691, #d94f72);
        color: white;
        text-decoration: none;
        font-weight: 700;
        box-shadow: 0 12px 28px #e8688748;
      }
      a:focus-visible {
        outline: 3px solid #4b312d;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <span>404</span>
      <h1>This page missed the party.</h1>
      <p>
        The cake you are looking for is not here, but plenty of sweet choices
        are.
      </p>
      <a href="/">Return to the cake shop</a>
    </main>
  </body>
</html>
